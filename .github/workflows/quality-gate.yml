name: PawPal Website Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  nextjs-quality-gate:
    name: Next.js Quality Gate
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Design token contract gates
        run: |
          npm run test:component-px
          npm run test:route-css-token
          npm run test:token-hotspot
          npm run test:tone-contract
          npm run test:state-contract
          npm run test:type-contract
          npm run test:shell-gutter
          npm run test:icon-contract

      - name: Homepage contract gate
        run: npm run test:home-contract

      - name: Unknown-page status and registry drift contract gates
        run: npm run test:not-found-contract

      - name: Shared post and pet data contract gate
        run: npm run test:shared-page-data

      - name: Cart persistence regression gate
        run: npm run test:cart-storage

      - name: Checkout, subscription and private persona regression gates
        run: |
          npm run test:checkout-flow
          npm run test:subscription-webhook
          npm run test:persona-auth

      - name: Globe facing gate
        run: npm run test:globe-facing

      - name: Homepage globe contract gate
        run: npm run test:home-globe-contract

      - name: Build verification
        run: npm run build

      - name: Bundle budget gate
        env:
          P3GB3_BUNDLE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          P3GB3_BUNDLE_HEAD_REF: ${{ github.sha }}
        run: npm run test:bundle-budget -- --base "$P3GB3_BUNDLE_BASE_REF" --head "$P3GB3_BUNDLE_HEAD_REF"

      - name: Install Chromium for runtime gate
        id: runtime-browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Next start, homepage five-state, cart and progress runtime gates
        if: steps.runtime-browser.outcome == 'success'
        run: |
          SERVER_LOG="$RUNNER_TEMP/pawpal-next-start.log"
          npm run start -- --hostname 127.0.0.1 --port 3102 >"$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          P3GB3_HOME_RUNTIME_BASE_URL=http://127.0.0.1:3102 npm run test:home-runtime
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            CART_RUNTIME_BASE_URL=http://127.0.0.1:3102 CART_RUNTIME_FIXTURE=1 npm run test:cart-runtime
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            HOME_PROGRESS_BASE_URL=http://127.0.0.1:3102 npm run test:home-progress-runtime
            STATUS=$?
          fi
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Next.js production server log:"
            sed -n '1,240p' "$SERVER_LOG"
            exit "$STATUS"
          fi

      - name: Service worker privacy and MapLibre security runtime gates
        if: steps.runtime-browser.outcome == 'success'
        run: |
          npm run test:service-worker-security
          npm run test:maplibre-security

      - name: Explicit runtime skip when Chromium is unavailable
        if: steps.runtime-browser.outcome != 'success'
        run: |
          echo "::warning::SKIP home/cart/progress/service-worker/MapLibre runtime gates — Playwright Chromium installation failed in this CI environment."
          echo "The skip is explicit; lint, contracts, build, and bundle gates still ran."

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Check for raw REST URL usage
        run: |
          VIOLATIONS=$(grep -rn 'supabase\.co/rest/v1' src/ --include="*.ts" --include="*.tsx" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ BLOCKED: Raw Supabase REST URL found. Use supabase-js client instead."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No raw REST URL usage."

      - name: Check for exposed secrets
        run: |
          SECRETS=$(grep -Ern 'sk_live_[A-Za-z0-9_]+|sk_test_[A-Za-z0-9_]+|sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' src/ --include="*.ts" --include="*.tsx" || true)
          if [ -n "$SECRETS" ]; then
            echo "❌ BLOCKED: Possible server secret exposed in client code."
            echo "$SECRETS"
            exit 1
          fi
          echo "✅ No exposed secrets."
