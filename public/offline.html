<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PawPal is offline</title>
    <meta
      name="description"
      content="PawPal could not reach the network. Reconnect to load live maps, store checkout, and pet safety profiles."
    />
    <style>
      :root {
        color-scheme: light;
        --page: #fff8ea;
        --ink: #3a2f2a;
        --body: #5f514a;
        --muted: #8f6a56;
        --primary: #4a90d9;
        --trust: #76c7b8;
        --border: #eadfd1;
        --panel: #ffffff;
        --subtle: #fffdf4;
        --mark-primary: #4a90d9;
        --mark-accent: #f28c44;
        --mark-dot: #2d3748;
        --accent-ink: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(74, 144, 217, 0.12), transparent 36%),
          linear-gradient(180deg, var(--page), var(--subtle));
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      section {
        width: min(100%, 32rem);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.9);
        padding: 2rem;
        box-shadow: 0 18px 48px rgba(58, 47, 42, 0.08);
      }

      .mark {
        display: block;
        height: 3rem;
        width: 3rem;
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(2rem, 7vw, 3.2rem);
        line-height: 1;
      }

      p {
        margin: 1rem 0 0;
        color: var(--body);
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        margin-top: 1.5rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--accent-ink);
        padding: 0 1.1rem;
        font-size: 0.92rem;
        font-weight: 800;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #141a20;
          --ink: #ffffff;
          --body: #e4d7cf;
          --muted: #b9917d;
          --primary: #74b8ea;
          --trust: #8dd8cc;
          --border: #42635d;
          --panel: #1b232a;
          --subtle: #243139;
          --mark-primary: #ffffff;
          --mark-accent: #ffcd38;
          --mark-dot: #76c7b8;
        }

        body {
          background:
            linear-gradient(135deg, rgba(116, 184, 234, 0.14), transparent 36%),
            linear-gradient(180deg, var(--page), var(--panel));
        }

        section {
          background: rgba(27, 35, 42, 0.92);
          box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <svg class="mark" width="48" height="48" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="offline-mark-title">
          <title id="offline-mark-title">PawPal</title>
          <g transform="translate(-4 2) scale(0.145)">
            <path fill="var(--mark-primary)" fill-rule="evenodd" d="M328 829c-28.2 0-51-22.8-51-51V329c0-119.3 96.7-216 216-216h39c118.7 0 215 96.3 215 215v82c0 118.7-96.3 215-215 215H379v153c0 28.2-22.8 51-51 51Zm51-307h153c62.4 0 113-50.6 113-113v-80c0-63-51-114-114-114h-38c-63 0-114 51-114 114v193Z"/>
            <circle cx="328" cy="574" r="51" fill="var(--mark-accent)"/>
            <circle cx="328" cy="778" r="51" fill="var(--mark-dot)"/>
          </g>
        </svg>
        <h1>You are offline</h1>
        <p>
          PawPal needs a connection for live maps, checkout, account data, and
          public pet safety profiles. Reconnect and retry from the home page.
        </p>
        <a href="/">Back to PawPal</a>
      </section>
    </main>
  </body>
</html>
